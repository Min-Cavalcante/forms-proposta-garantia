<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proposta de Garantia do Fabricante</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Bebas+Neue&display=swap"
    >
    <link rel="stylesheet" href="./colors_and_type.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--bg-paper);
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: var(--space-7) var(--space-5);
            font-family: var(--font-body);
            font-size: var(--fs-body);
            line-height: 1.55;
            color: var(--fg-1);
            background: var(--bg-paper);
        }

        .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .form-card {
            overflow: hidden;
            background: var(--bg-surface);
            border: 1px solid var(--border-hairline);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }

        .form-header {
            padding: var(--space-7);
            color: var(--fg-inverse);
            background: var(--bg-hero);
            border-bottom: 4px solid var(--gauss-green);
        }

        .brand-lockup {
            display: block;
            width: min(260px, 70%);
            height: auto;
            margin-bottom: var(--space-7);
        }

        .eyebrow {
            margin: 0 0 var(--space-2);
            font-family: var(--font-display);
            font-size: var(--fs-label);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gauss-green);
        }

        .form-header h1 {
            margin: 0;
            max-width: 620px;
            font-family: var(--font-display);
            font-size: clamp(32px, 6vw, 48px);
            font-weight: 800;
            line-height: var(--lh-heading);
            letter-spacing: -0.03em;
            color: var(--white);
        }

        .form-header p:not(.eyebrow) {
            margin: var(--space-3) 0 0;
            max-width: 600px;
            color: var(--ink-300);
        }

        form {
            padding: var(--space-7);
        }

        .form-section {
            margin: 0 0 var(--space-7);
            padding: 0 0 var(--space-7);
            border-bottom: 1px solid var(--border-hairline);
        }

        .form-section:last-of-type {
            margin-bottom: var(--space-5);
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin: 0 0 var(--space-5);
            font-family: var(--font-display);
            font-size: var(--fs-label);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--fg-3);
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-hairline);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: var(--space-2);
            font-family: var(--font-display);
            font-size: var(--fs-sm);
            font-weight: 600;
            line-height: 1.4;
            color: var(--fg-2);
        }

        input,
        select,
        textarea {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--ink-300);
            border-radius: var(--radius-sm);
            outline: none;
            background: var(--bg-surface);
            color: var(--fg-1);
            font-family: var(--font-body);
            font-size: 15px;
            line-height: 1.45;
            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease,
                background 0.15s ease;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: var(--ink-400);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--gauss-green);
            box-shadow: var(--shadow-glow-green);
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--fg-3);
        }

        input[type="number"] {
            font-variant-numeric: tabular-nums;
        }

        .inversor-card {
            margin-top: var(--space-5);
            padding: var(--space-5);
            background: var(--bg-paper);
            border: 1px solid var(--border-hairline);
            border-left: 3px solid var(--gauss-green);
            border-radius: var(--radius-md);
        }

        .inversor-card:first-child {
            margin-top: 0;
        }

        .inversor-card label {
            margin-top: var(--space-4);
        }

        .inversor-card h4 {
            margin: 0 0 var(--space-4);
        }

        h4 {
            margin: 0 0 var(--space-5);
            font-family: var(--font-display);
            font-size: var(--fs-h4);
            font-weight: 700;
            line-height: var(--lh-heading);
            color: var(--fg-1);
        }

        .substituicao {
            margin-top: var(--space-5);
            padding: var(--space-4);
            background: var(--gauss-green-100);
            border: 1px solid var(--gauss-green-300);
            border-radius: var(--radius-sm);
        }

        .substituicao-title {
            margin: 0 0 var(--space-4);
            font-family: var(--font-display);
            font-size: var(--fs-sm);
            font-weight: 700;
            color: var(--gauss-green-900);
        }

        .substituicao label {
            margin-top: var(--space-4);
        }

        .substituicao label:first-of-type {
            margin-top: 0;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            padding-top: var(--space-2);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            min-height: 48px;
            padding: 12px 24px;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            background: var(--gauss-green);
            color: var(--ink-1000);
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition:
                background 0.15s ease,
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        button:hover {
            background: var(--gauss-green-700);
            color: var(--white);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: none;
            box-shadow: var(--shadow-glow-green);
        }

        @media (max-width: 640px) {
            body {
                padding: var(--space-4);
            }

            .form-header,
            form {
                padding: var(--space-5);
            }

            .form-header {
                border-bottom-width: 3px;
            }

            .brand-lockup {
                width: 220px;
                margin-bottom: var(--space-6);
            }

            .form-header h1 {
                font-size: 32px;
            }

            .inversor-card {
                padding: var(--space-4);
            }

            .actions button {
                width: 100%;
            }
        }
    </style>
</head>

    <script>
        function gerarCamposInversores() {
            const numInversores = Math.max(
                1,
                parseInt(document.getElementById('inversoresProblema').value, 10) || 1
            );

            const inversoresFields = document.getElementById('inversoresFields');

            inversoresFields.innerHTML = '';

            for (let i = 1; i <= numInversores; i++) {
                inversoresFields.innerHTML += `
                    <div class="inversor-card">
                        <h4>Inversor ${i}</h4>

                        <label for="potenciaAc${i}">
                            Potência do inversor (AC)
                        </label>
                        <input
                            type="number"
                            id="potenciaAc${i}"
                            name="potenciaAc${i}"
                            required
                        >

                        <label for="potenciaSistema${i}">
                            Potência do sistema (kWp)
                        </label>
                        <input
                            type="number"
                            id="potenciaSistema${i}"
                            name="potenciaSistema${i}"
                            required
                        >

                        <label for="marcaInversor${i}">
                            Marca do inversor
                        </label>
                        <input
                            type="text"
                            id="marcaInversor${i}"
                            name="marcaInversor${i}"
                            required
                        >

                        <label for="temEstoque${i}">
                            Tem em estoque
                        </label>
                        <select
                            id="temEstoque${i}"
                            name="temEstoque${i}"
                            required
                        >
                            <option value="Sim">Sim</option>
                            <option value="Não">Não</option>
                        </select>

                        <div
                            id="substituicaoInversor${i}"
                            class="substituicao"
                            style="display: none;"
                        >
                            <p class="substituicao-title">
                                Dados do inversor para substituição
                            </p>

                            <label for="marcaSubstituicao${i}">
                                Marca do inversor a ser substituído
                            </label>
                            <input
                                type="text"
                                id="marcaSubstituicao${i}"
                                name="marcaSubstituicao${i}"
                            >

                            <label for="potenciaSubstituicao${i}">
                                Potência do inversor a ser substituído
                            </label>
                            <input
                                type="number"
                                id="potenciaSubstituicao${i}"
                                name="potenciaSubstituicao${i}"
                            >

                            <label for="valorSubstituicao${i}">
                                Valor do inversor a ser substituído
                            </label>
                            <input
                                type="number"
                                id="valorSubstituicao${i}"
                                name="valorSubstituicao${i}"
                            >
                        </div>
                    </div>
                `;
            }

            document
                .querySelectorAll('select[name^="temEstoque"]')
                .forEach(select => {
                    select.addEventListener('change', function () {
                        const inversorIndex =
                            this.name.split('temEstoque')[1];

                        const substituicaoDiv =
                            document.getElementById(
                                `substituicaoInversor${inversorIndex}`
                            );

                        if (this.value === 'Não') {
                            substituicaoDiv.style.display = 'block';
                        } else {
                            substituicaoDiv.style.display = 'none';
                        }
                    });
                });
        }

        document
            .getElementById('inversoresProblema')
            .addEventListener('input', gerarCamposInversores);

        gerarCamposInversores();

        document
            .getElementById('garantiaForm')
            .addEventListener('submit', function (event) {
                event.preventDefault();

                const formData = new FormData(this);
                const formValues = {};

                formData.forEach((value, key) => {
                    formValues[key] = value;
                });

                console.log(formValues);

                alert('Formulário enviado com sucesso!');
            });
    </script>
</body>
</html>
